; ═══════════════════════════════════════════════════════════════════
;  图书馆 AIGC 内容审核工具 · 主配置文件
;  最后更新：2025-01
;  说明：所有相对路径均以项目根目录为基准
; ═══════════════════════════════════════════════════════════════════

; ── 路径配置 ────────────────────────────────────────────────────────
[paths]

; 事实核查规则库（JSON）
facts_db        = config/facts_db.json

; 语义检测词库（JSON）
blacklist_db = config/blacklist_db.json
whitelist_db = config/whitelist_db.json
; 审核结果输出根目录
output_dir      = output

; 图表输出子目录（visualizer.py 使用）
charts_dir      = output/charts

; 运行日志路径（batch_audit.py FileHandler 使用）
log_file        = output/audit.log

; ── 语义模型配置 ─────────────────────────────────────────────────────
[model]

; sentence-transformers 模型名称或本地路径
; 在线：sentence-transformers/BAAI/bge-small-zh-v1.5
; 离线：填写本地模型目录绝对路径，如 D:/models/BAAI/bge-small-zh-v1.5
model_name      = BAAI/bge-small-zh-v1.5

; 向量维度（需与模型输出一致）
embedding_dim   = 512

; FAISS 检索返回的候选数量（越大越慢，越精准）
top_k           = 5

[network]
; 国内镜像源，与 model_utils.py 中 os.environ 保持一致
; 部分环境 os.environ 设置可能被覆盖，此处作为二次保障记录
hf_endpoint   = https://hf-mirror.com

; ── 四维权重配置 ─────────────────────────────────────────────────────
[weights]
; 说明：四项之和应为 1.0
;       batch_audit._load_config() 读取后会自动归一化兜底

; 事实核查权重（最高，任何事实错误影响最大）
fact        = 0.50

; 品牌调性权重（口语化程度影响）
brand       = 0.18

; 合规安全权重（敏感词风险影响）
compliance  = 0.20

; 规范表达权重
norm        = 0.12

; ── 蒙特卡洛模拟参数 ──────────────────────────────────────────────────
[monte_carlo]

; 模拟次数：建议 5000～50000，越大越精准越慢
n_simulations       = 10000

; 权重扰动标准差：控制不确定性范围
; 建议范围：0.05（保守）~ 0.25（激进）
perturbation_sigma  = 0.15

; 随机种子：固定保证可复现，设为 -1 表示不固定
random_seed         = 42

; 权重裁剪下界：防止单维度权重过小（趋近于0）
weight_bound_low    = 0.05

; 权重裁剪上界：防止单维度权重过大（主导结果）
weight_bound_high   = 0.80

; ── 决策阈值 ─────────────────────────────────────────────────────────
[thresholds]

; 通过阈值：pass_probability >= 0.90 且 ci_95 下界 >= review_threshold → APPROVE
pass_threshold      = 0.80

; 复核阈值：均值 >= review_threshold → REVIEW，否则 → REJECT
review_threshold    = 0.60

; ── 硬性否决规则（任意一条触发 → 强制 REJECT，不看 mean）────────────
[hard_reject]

; brand 或 compliance 任意一个低于此值 → REJECT
; case1: brand=0.43, compliance=0.36 → 均低于 0.45 → 触发 REJECT 
single_dim_reject_threshold = 0.45

; brand + compliance 均值低于此值 → REJECT  
; 双维度联合否决，防止单维度侥幸通过
brand_compliance_avg_reject = 0.50

; ── 硬性复核规则（触发 → 强制 REVIEW，不能 APPROVE）────────────────
[hard_review]

; fact_score 低于此值 → 强制 REVIEW（有事实错误，不能直接通过）
; case2: fact_score=0.7 → 触发强制 REVIEW 
fact_score_review_threshold = 0.95

; pass_probability 低于此值时，即使 mean 达标也不能 APPROVE → REVIEW
; case2: pass_probability≈0.45 < 0.60 → 触发强制 REVIEW  
pass_prob_min_for_approve   = 0.60

; ── 日志配置 ─────────────────────────────────────────────────────────
[logging]

; 日志级别：DEBUG / INFO / WARNING / ERROR / CRITICAL
log_level           = INFO

; 是否同时输出到控制台（true/false）
console_output      = true

; 单个日志文件最大体积（字节），超出后滚动
; 默认 10MB = 10485760
max_bytes           = 10485760

; 最多保留的滚动日志文件数
backup_count        = 3